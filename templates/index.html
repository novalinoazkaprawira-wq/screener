<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laptop Recordings</title>
<style>
  :root {
    --bg: #0f1216;
    --card: #1a1f26;
    --text: #e7ecf3;
    --muted: #8b96a5;
    --accent: #4f9dff;
    --danger: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .record-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .record-bar input[type="number"] {
    width: 90px;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #2a323d;
    background: var(--card);
    color: var(--text);
    font-size: 15px;
  }
  .record-bar button {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: var(--danger);
    color: white;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
  }
  .record-bar button:disabled {
    background: #444;
    cursor: wait;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 20px;
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .card video {
    width: 100%;
    border-radius: 8px;
    background: #000;
    display: block;
  }
  .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 10px 2px 4px;
    font-size: 13px;
    color: var(--muted);
    gap: 8px;
  }
  .meta .name {
    color: var(--text);
    font-weight: 600;
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .download {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    white-space: nowrap;
  }
  .toast {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: white;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 14px;
    opacity: 0;
    transition: opacity .25s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<h1>🎥 Laptop Recordings</h1>

<div class="record-bar">
  <input id="duration" type="number" value="30" min="1" max="600" aria-label="Duration in seconds">
  <button id="recBtn">Record screen</button>
</div>

{% if recordings %}
  {% for r in recordings %}
  <div class="card">
    <video controls playsinline preload="metadata"
           src="{{ url_for('video', filename=r.name) }}"></video>
    <div class="meta">
      <span class="name">{{ r.name }}</span>
      <span>{{ r.size_mb }} MB · {{ r.mtime_str }}</span>
      <a class="download" href="{{ url_for('video', filename=r.name) }}" download>Save</a>
    </div>
  </div>
  {% endfor %}
{% else %}
  <div class="empty">No recordings yet. Tap <b>Record screen</b> above.</div>
{% endif %}

<div id="toast" class="toast"></div>

<script>
const btn = document.getElementById('recBtn');
const durInput = document.getElementById('duration');
const toast = document.getElementById('toast');

function showToast(msg, ms=2500) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), ms);
}

btn.addEventListener('click', async () => {
  const duration = Math.max(1, Math.min(600, parseInt(durInput.value || '30', 10)));
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = `Recording… ${duration}s`;

  // countdown in the button so the user sees progress
  let left = duration;
  const tick = setInterval(() => {
    left--;
    btn.textContent = left > 0 ? `Recording… ${left}s` : 'Finishing…';
  }, 1000);

  try {
    const res = await fetch('/record', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ duration })
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || 'Recording failed');
    }
    showToast('Recording saved!');
    // reload after a moment so the new card appears
    setTimeout(() => location.reload(), 400);
  } catch (e) {
    showToast('❌ ' + e.message, 4000);
    btn.disabled = false;
    btn.textContent = original;
  } finally {
    clearInterval(tick);
  }
});
</script>

</body>
</html>
